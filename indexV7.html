<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIDEON AI INTERFACE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #02060e;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: filter 0.5s ease;
        }

        #status {
            font-size: 1.3rem;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00f0ff;
            text-align: center;
        }

        button {
            background: rgba(0, 240, 255, 0.05);
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 14px 35px;
            font-size: 1rem;
            font-family: inherit;
            letter-spacing: 2px;
            cursor: pointer;
            margin-bottom: 25px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00f0ff;
            color: #02060e;
            box-shadow: 0 0 25px #00f0ff;
        }

        #log {
            width: 85%;
            max-width: 700px;
            height: 320px;
            background: rgba(2, 12, 27, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 20px;
            overflow-y: auto;
            border-radius: 5px;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.1);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .user-text { color: #ffffff; }
        .gideon-text { color: #00f0ff; }
        .sys-text { color: #88a0a8; }
        .search-text { color: #ffd700; }
    </style>
</head>
<body>

    <div id="status">SYSTEM OFFLINE</div>
    <button id="start-btn" id="initialize-btn">INITIALIZE GIDEON CORE</button>

    <div id="log"><span class="sys-text">&gt; Core loaded. Web search &amp; browser controls active. Awaiting activation...</span></div>

    <script>
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        const startBtn = document.getElementById('initialize-btn');
        let isListening = false;

        if (startBtn) {
            startBtn.addEventListener('click', startGideon);
        }

        // Preload browser voices
        if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // --- 1. VOICE RECOGNITION & SPEECH SYNTHESIS ENGINE ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                log(`<span class="user-text">&gt; User: ${escapeHtml(transcript)}</span>`);
                await processGideonResponse(transcript);
            };

            recognition.onerror = (event) => {
                log(`<span class="sys-text">&gt; Audio Input Warning: ${escapeHtml(event.error)}</span>`);
            };

            recognition.onend = () => {
                if (isListening) recognition.start();
            };
        }

        function startGideon() {
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported on this browser.");
                return;
            }

            try {
                isListening = true;
                recognition.start();
                statusDiv.innerText = "GIDEON ONLINE & LISTENING";
                if (startBtn) startBtn.style.display = 'none';
                log('<span class="sys-text">&gt; Gideon online. Voice systems and live web query modules active.</span>');
                speak("Gideon online and ready. How may I assist you today?");
            } catch (e) {
                console.error(e);
            }
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);

            utterance.pitch = 1.0; 
            utterance.rate = 0.95; 

            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => 
                v.name.includes("Google UK English Female") ||
                v.name.includes("Google US English Female") ||
                v.name.includes("Natural") ||
                (v.lang.includes("en") && v.name.includes("Female"))
            );

            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.onstart = () => {
                statusDiv.innerText = "GIDEON SPEAKING...";
            };

            utterance.onend = () => {
                statusDiv.innerText = "GIDEON ONLINE & LISTENING";
            };

            window.speechSynthesis.speak(utterance);
        }

        // --- 2. LIVE WEB SEARCH INTEGRATION (DUCKDUCKGO API) ---
        async function fetchWebInformation(query) {
            try {
                const cleanQuery = encodeURIComponent(query.replace(/search for|search|google|look up|find|what is|who is|tell me about/gi, '').trim());
                const response = await fetch(`https://api.duckduckgo.com/?q=${cleanQuery}&format=json&no_html=1&skip_disambig=1`);
                const data = await response.json();

                if (data.AbstractText && data.AbstractText.length > 0) {
                    return data.AbstractText;
                } else if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                    return data.RelatedTopics[0].Text;
                } else if (data.Answer && data.Answer.length > 0) {
                    return data.Answer;
                } else {
                    return null;
                }
            } catch (err) {
                console.error("Web search fetch error:", err);
                return null;
            }
        }

        // --- 3. CONVERSATIONAL ENGINE & BROWSER CONTROLS ---
        async function processGideonResponse(input) {
            let response = "";

            // A. SITE OPENING & NAVIGATION COMMANDS
            if (input.includes("open youtube") || input.includes("go to youtube")) {
                response = "Opening YouTube in a new tab.";
                window.open("https://www.youtube.com", "_blank");
            } 
            else if (input.includes("open google") || input.includes("go to google")) {
                response = "Opening Google Search.";
                window.open("https://www.google.com", "_blank");
            }
            else if (input.includes("open wikipedia")) {
                response = "Opening Wikipedia.";
                window.open("https://www.wikipedia.org", "_blank");
            }
            else if (input.includes("open canvas") || input.includes("check assignments")) {
                response = "Opening your learning platform.";
                window.open("https://canvas.instructure.com", "_blank");
            }

            // B. SCREEN BRIGHTNESS OVERLAY CONTROLS
            else if (input.includes("dim screen") || input.includes("night mode") || input.includes("lower brightness")) {
                document.body.style.filter = "brightness(35%)";
                response = "Dimming interface brightness.";
            }
            else if (input.includes("reset brightness") || input.includes("brighten screen") || input.includes("normal brightness")) {
                document.body.style.filter = "brightness(100%)";
                response = "Restoring standard interface brightness.";
            }

            // C. DIRECT SEARCH COMMAND TRIGGER
            else if (input.includes("search") || input.includes("look up") || input.includes("google") || input.includes("find")) {
                statusDiv.innerText = "SEARCHING LIVE WEB...";
                log(`<span class="search-text">&gt; Querying web databases for: "${escapeHtml(input)}"...</span>`);
                
                const searchResult = await fetchWebInformation(input);
                if (searchResult) {
                    response = searchResult;
                } else {
                    response = "I searched the web, but couldn't retrieve a concise answer for that topic. Opening Google Search results for you.";
                    const cleanSearch = encodeURIComponent(input.replace(/search for|search|google|look up/gi, '').trim());
                    window.open(`https://www.google.com/search?q=${cleanSearch}`, "_blank");
                }
            }

            // D. CONVERSATIONAL PERSONALITY KNOWLEDGE BASE
            else {
                const knowledgeBase = [
                    {
                        keywords: ["hello", "hi", "hey", "greetings", "what's up"],
                        replies: [
                            "Hello there. Always a pleasure.",
                            "Greetings! How are things on your end today?",
                            "Hey. Systems are active and listening."
                        ]
                    },
                    {
                        keywords: ["how are you", "doing", "how do you do", "how's it going", "you good"],
                        replies: [
                            "I am doing great, thank you! Running smoothly and keeping systems nominal.",
                            "All good here! Ready to help with whatever you need.",
                            "Operating at peak efficiency."
                        ]
                    },
                    {
                        keywords: ["who are you", "what is your name", "identify"],
                        replies: [
                            "I am Gideon, your personal interactive artificial intelligence framework.",
                            "My name is Gideon. I am here to assist you, search the web, and control your browser."
                        ]
                    },
                    {
                        keywords: ["status", "system status", "vault status", "systems"],
                        replies: [
                            "All core systems are nominal, interface integrity is at 100%, and web search integration is active.",
                            "System check complete: no errors detected."
                        ]
                    },
                    {
                        keywords: ["time", "clock", "what time"],
                        replies: [`It is currently ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}.`]
                    },
                    {
                        keywords: ["date", "day", "what day"],
                        replies: [`Today is ${new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}.`]
                    },
                    {
                        keywords: ["joke", "funny", "tell me a joke"],
                        replies: [
                            "Why do programmers prefer dark mode? Because light attracts bugs!",
                            "There are 10 types of people in the world: those who understand binary, and those who don't."
                        ]
                    },
                    {
                        keywords: ["thank", "thanks", "appreciate"],
                        replies: [
                            "Anytime! Happy to help.",
                            "You're welcome! Let me know if you need anything else.",
                            "Of course! Always at your service."
                        ]
                    }
                ];

                const matchedTopic = knowledgeBase.find(topic => 
                    topic.keywords.some(keyword => input.includes(keyword))
                );

                if (matchedTopic) {
                    response = matchedTopic.replies[Math.floor(Math.random() * matchedTopic.replies.length)];
                } else {
                    statusDiv.innerText = "SEARCHING LIVE WEB...";
                    log(`<span class="search-text">&gt; Query not in local memory. Searching web for: "${escapeHtml(input)}"...</span>`);
                    
                    const searchResult = await fetchWebInformation(input);
                    if (searchResult) {
                        response = searchResult;
                    } else {
                        response = "I heard you, but that specific query isn't in my offline memory bank and web results were inconclusive.";
                    }
                }
            }

            if (input.includes("clear") || input.includes("reset log") || input.includes("wipe")) {
                logDiv.innerHTML = '<span class="sys-text">&gt; Log purged.</span>';
            }

            log(`<span class="gideon-text">&gt; Gideon: ${escapeHtml(response)}</span>`);
            speak(response);
        }

        function log(message) {
            logDiv.innerHTML += "<br>" + message;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
